{{- if .Values.hooks.presync.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kaz-generic-chart.fullname" . }}-presync-hook
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    {{- with .Values.hooks.presync.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.hooks.presync.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.hooks.presync.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "kaz-generic-chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: presync-hook
    spec:
      restartPolicy: Never
      containers:
      - name: presync-hook-container
        image: quay.io/skopeo/stable:latest
        
        command:
          - sh
          - -c
          - |
            #!/bin/sh
            set -e
            echo 1;

            
            sleep 1000;
        env:
        - name: TARGET_REGISTRY_USER
          valueFrom:
            secretKeyRef:
              name: "docker-registry-secret"
              key: "username"
        - name: TARGET_REGISTRY_PASS
          valueFrom:
            secretKeyRef:
              name: "docker-registry-secret"
              key: "password"
      

  backoffLimit: 3
{{- end }}
